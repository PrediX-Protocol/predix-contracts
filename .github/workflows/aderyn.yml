name: Aderyn (static analysis)

# Audit M-02. Slither is blocked on the via_ir + nested OZ remappings — see
# docs/STATIC_ANALYSIS_STATUS.md. Aderyn (Rust-based, Cyfrin) supports
# via_ir and the foundry framework natively. Soft-fail on findings while
# the team builds out a triage database; switch to hard-fail before
# mainnet handover.

on:
  push:
    branches: [develop, master]
  pull_request:
    paths:
      - 'packages/**/*.sol'
      - 'packages/**/foundry.toml'
      - '.github/workflows/aderyn.yml'
  workflow_dispatch:

concurrency:
  group: aderyn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aderyn:
    name: Aderyn (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [shared, oracle, diamond, hook, exchange, router, paymaster]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: aderyn-cargo-${{ runner.os }}-v1

      - name: Install Aderyn
        # Cyfrinup's install URL changed multiple times — switch to a direct
        # `cargo install` against the latest published crate. Slow (~3 min)
        # on first run, then served from the cargo cache above.
        run: |
          if ! command -v aderyn >/dev/null 2>&1; then
            cargo install aderyn --locked
          fi
          aderyn --version

      - name: Compile package
        working-directory: packages/${{ matrix.package }}
        run: forge build --sizes

      - name: Run Aderyn
        working-directory: packages/${{ matrix.package }}
        # Soft-fail while building the triage database: print findings, never
        # block the build. Tighten to `--exit-code-on-findings` before
        # mainnet handover.
        run: |
          aderyn . --output aderyn-report.md || true
          if [ -f aderyn-report.md ]; then
            echo "=== aderyn findings for ${{ matrix.package }} ==="
            head -n 200 aderyn-report.md
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aderyn-${{ matrix.package }}
          path: packages/${{ matrix.package }}/aderyn-report.md
          if-no-files-found: ignore
