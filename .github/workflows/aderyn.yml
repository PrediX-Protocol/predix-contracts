name: Aderyn (static analysis)

# Audit M-02. Slither is blocked on the via_ir + nested OZ remappings — see
# docs/STATIC_ANALYSIS_STATUS.md. Aderyn (Rust-based, Cyfrin) supports
# via_ir and the foundry framework natively. Soft-fail on findings while
# the team builds out a triage database; switch to hard-fail before
# mainnet handover.

on:
  push:
    branches: [develop, master]
  pull_request:
    paths:
      - 'packages/**/*.sol'
      - 'packages/**/foundry.toml'
      - '.github/workflows/aderyn.yml'
  workflow_dispatch:

concurrency:
  group: aderyn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aderyn:
    name: Aderyn (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [shared, oracle, diamond, hook, exchange, router, paymaster]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Aderyn
        # Cyfrin distributes Aderyn via GitHub releases (and homebrew / npm),
        # not crates.io — `cargo install aderyn` pulls a different,
        # unrelated crate squatting the name. Download the prebuilt
        # x86_64-linux tarball directly. Bump ADERYN_VERSION when a newer
        # release ships.
        env:
          ADERYN_VERSION: "0.6.8"
        run: |
          curl -fL \
            "https://github.com/Cyfrin/aderyn/releases/download/aderyn-v${ADERYN_VERSION}/aderyn-x86_64-unknown-linux-gnu.tar.xz" \
            -o /tmp/aderyn.tar.xz
          mkdir -p /tmp/aderyn-extract
          tar -xJf /tmp/aderyn.tar.xz -C /tmp/aderyn-extract
          ADERYN_BIN="$(find /tmp/aderyn-extract -type f -name aderyn -perm -u+x | head -1)"
          if [ -z "$ADERYN_BIN" ]; then
            echo "ERROR: aderyn binary not found in tarball"; ls -R /tmp/aderyn-extract; exit 1
          fi
          sudo install -m 0755 "$ADERYN_BIN" /usr/local/bin/aderyn
          aderyn --version

      - name: Compile package
        working-directory: packages/${{ matrix.package }}
        run: forge build --sizes

      - name: Run Aderyn
        working-directory: packages/${{ matrix.package }}
        # Soft-fail while building the triage database: print findings, never
        # block the build. Tighten to `--exit-code-on-findings` before
        # mainnet handover.
        run: |
          aderyn . --output aderyn-report.md || true
          if [ -f aderyn-report.md ]; then
            echo "=== aderyn findings for ${{ matrix.package }} ==="
            head -n 200 aderyn-report.md
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aderyn-${{ matrix.package }}
          path: packages/${{ matrix.package }}/aderyn-report.md
          if-no-files-found: ignore
